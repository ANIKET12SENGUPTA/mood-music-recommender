<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeVault</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="page-shell">
        <header class="topbar">
            <div class="brand">
                <div class="brand-mark">♫</div>
                <div>
                    <div class="brand-name">VibeVault</div>
                    <div class="brand-subtitle">Smart mood-based music</div>
                </div>
            </div>
            <button id="spotify-login" class="secondary">Login with Spotify</button>
        </header>

        <div class="main-box">
            <div class="hero">
                <span class="chip">AI Music Match</span>
                <h1>Find the soundtrack to your mood.</h1>
                <p class="tagline">Tell VibeVault how you feel, what you’re doing, or what vibe you want — and it will suggest songs that actually fit.</p>
            </div>

            <p id="auth-status" class="auth-status">Checking Spotify login...</p>

            <textarea id="text" placeholder="Example: I’m stressed after a long day, want something calm and cozy, maybe rainy-night energy..."></textarea>

            <div class="toolbar">
                <button onclick="getMusic()">Recommend Music</button>
                <button id="save-playlist" class="secondary ghost" onclick="savePlaylist()">Save to Spotify Playlist</button>
            </div>

            <h2 id="emotion"></h2>
            <div id="results"></div>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
